<html>
    <head>
        <title>Resuelve Ecuaciones</title>
    </head>
    <body>
        <h2>Encuentra soluciones, vertices, caracterizticas de graficación  ¡Derroca al profe David Olguin!</h2>
        <br>
        <div style="display: flex;">
        <h1>F(<input id="x" size="10px" placeholder="          X"></input>) =
            <h1 id="ecuation">Ax² + Bx + C</h1></h1>

            <button id="function" style="width: fit-content; height: fit-content;";">Calcular valor "X" en la funcion</button>
            <canvas id="graph" width="400" height="300"></canvas>
            <img id="result1">
</button>

       
        <br>
    </div>
        <h2>Por favor modifique las variables de abajo a su gusto, luego haga click en solucionar</h2>
    </body>
    <br>
    <input id="A" type="number" placeholder="Ingrese A">
    <br>
    <input id="B" type="number" placeholder="Ingrese B">
    <br>
    <input id="C" type="number" placeholder="Ingrese C">
    <br>
    <button id="calc">Calcular</button>
    <br>
    <script src="./client.js"></script>
    <button onclick="`${location.href = './desfactorizador.html'}`">Siguiente Página</button>
    <div id="result" style="width: 500; height: 100;"></div>


<script>

//Obtenemos las variables seteadas
let original = "Ax² + Bx + c"

let response = ""
function drawPoint(x, y, text) {
    const canvas = document.getElementById("graph");
    const ctx = canvas.getContext("2d");

    const width = canvas.width;
    const height = canvas.height;
    const scale = 30;
    const originX = width / 2;
    const originY = height / 2;
    const px = originX + x * scale;
    const py = originY - y * scale;

    // Punto
    ctx.beginPath();
    ctx.arc(px, py, 5, 0, Math.PI * 2);
    ctx.fillStyle = "red";
    ctx.fill();

    // Número
    ctx.font = "16px Arial";
    ctx.fillStyle = "black";
    ctx.fillText(text, px + 8, py - 8);
}

function resolver(a, b, c, canSolve=true){   
  let discriminante = Math.pow(b, 2) - 4*a*c
   let x1 = -b + (Math.sqrt(discriminante))
    let x2 = -b - (Math.sqrt(discriminante))
    if(canSolve){
//
 
    let s = 2*a
    x1 = x1/s
    x2= x2/s

    response += `El valor de X y las interseccion en las absisas (x) en la ecuacion: ${a}x² + ${b}x + ${c} ${discriminante > 0 ? `son (${x1}, 0) y (${x2}, 0)` : `es (${x1}, 0)`}\n`.replaceAll("+ (-", "-").replaceAll("+ -", "- ")
    response += `El corte en Y de la parabola se encuentra en (0,${c})\n`
    }
   const canvas = document.getElementById("graph");
    const ctx = canvas.getContext("2d");

    const width = canvas.width;
    const height = canvas.height;

    // Limpiar
    ctx.clearRect(0, 0, width, height);

    // Sistema de coordenadas
    const scale = 30;
    const originX = width / 2;
    const originY = height / 2;

    // Fondo
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, width, height);

    // Ejes
    ctx.beginPath();

    ctx.moveTo(0, originY);
    ctx.lineTo(width, originY);

    ctx.moveTo(originX, 0);
    ctx.lineTo(originX, height);

    ctx.strokeStyle = "black";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Función
    ctx.beginPath();

    for (let px = 0; px <= width; px++) {

        const x = (px - originX) / scale;

        const y = a * x ** 2 + b * x + c;

        const py = originY - y * scale;

        if (px === 0) {
            ctx.moveTo(px, py);
        } else {
            ctx.lineTo(px, py);
        }
        
    }

    ctx.strokeStyle = "blue";
    ctx.lineWidth = 3;
    ctx.stroke();
    if(discriminante > 0){
drawPoint(x1, 0, `(${x1}, 0)`);
drawPoint(x2, 0, `(${x2}, 0)`);
    }else {
        drawPoint(x1, 0, `(${x1})`)
    }
drawPoint(0, c, `(0, ${c})`);



}

function getParabola(a, b, c){
if(a<0) response += "La parabola de la ecuación tiene una orientación negativa :(\n"
if(a>0) response += "La parabola de la ecuación tiene una orientación positiva :)\n"

let verticeX = -b/2*a
let verticeY = fx(verticeX, a, b, c)
 let discriminante = Math.pow(b, 2) - 4*a*c

    response += `El discriminante tiene un valor de ${discriminante}\n`
 response += `El punto ${a > 0 ? "Mínimo" : "Máximo"} de la parabola está ubicado en (${verticeX}, ${verticeY})\n`
}
function fx(x, a, b ,c){
    let s = a*Math.pow(x, 2) + b*x + c
    drawPoint(x, s, `(${x},${s})`)
    return s
}
let entrarFunc = document.getElementById('function').addEventListener('click', () => {
    let x = Number(document.getElementById('x').value)
    document.getElementById('ecuation').innerHTML.replace("x", x)
let a = Number(document.getElementById('A').value)
let b = Number(document.getElementById('B').value)
let c = Number(document.getElementById('C').value)
if(!a) return alert("No se puede resolver la cuadratica")
    let result = fx(x, a, b, c)
document.getElementById('ecuation').innerHTML = `${a}*${x}² + ${b}*${x} + ${c} = ${result}`.replaceAll("+ (-", "-").replaceAll("+ -", "- ")
})
let btn = document.getElementById('calc')
function btnFunction(){


let a = Number(document.getElementById('A').value)
let b = Number(document.getElementById('B').value)
let c = Number(document.getElementById('C').value)
let canSolve = false

if(!a) return alert("No puedes tener una cuadrática sin A")
let discriminante = Math.pow(b, 2) - 4*a*c

if(discriminante < 0) response += "La ecuación no tiene soluciones\n"
if(discriminante == 0) response += "La ecuación contiene solo UNA solución\n"
if(discriminante > 0) response += "La ecuación tiene DOS soluciones\n"

if(discriminante >= 0 ) canSolve = true

document.getElementById('ecuation').innerHTML = `<h2>${a}x² + ${+b}x + ${c}`.replaceAll("+ (-", "- ").replaceAll("+ -", "-")
if(canSolve) resolver(a, b, c)
getParabola(a, b, c)

document.getElementById('result').innerText = response
response = ""
}
btn.addEventListener('click', () => {
btnFunction()
})

let elements = [
    document.getElementById('A'),
    document.getElementById('B'),
    document.getElementById('C'),
    document.getElementById('calc'),
]
elements.forEach((e, index) => {
    e.addEventListener('keydown', (event) => {
          if (event.key !== "Enter") return;
        event.preventDefault()
        if(e.id == 'calc'){
            e.click()
            return
        }
        let next = elements[index + 1]
        next.focus()
    })
})


</script>

</html>
