<h2>¿Cómo se ve la ecuación factorizada?</h2>
<br>
<h1>(Modo 1) Cuadrado de binomio: (x+b)² = x² + 2xb + b² | x² - 2xb + b²</h1>
<br>
<h1>(Modo 2)Termino Comun:  (x + e)(x + d) = x² + (e+d)x + e*d </h1>
<br>
